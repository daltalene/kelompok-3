[agent]
  interval = "5s"
  flush_interval = "5s"

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "ISI_TOKEN_INFLUXDB"
  organization = "kampus"
  bucket = "iot"

[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["#"]
  username = "esp32"
  password = "ISI_PASSWORD_MQTT"
  data_format = "json"
